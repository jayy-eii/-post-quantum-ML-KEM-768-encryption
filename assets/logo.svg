<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="qsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#00E5B0" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112438" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#07111F" stop-opacity="0.9" />
    </linearGradient>
    <filter id="qsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Contour -->
  <path d="M24 4L7 11V22C7 33.1 14.3 43.3 24 46C33.7 43.3 41 33.1 41 22V11L24 4Z" 
        fill="url(#shieldFill)" stroke="url(#qsGradient)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Quantum Lattice / Hexagonal Orbit Core -->
  <polygon points="24,13 32,18 32,28 24,33 16,28 16,18" 
           stroke="#00D9FF" stroke-width="1.75" stroke-dasharray="2 1" fill="none" opacity="0.85" />
  
  <!-- Central Cryptographic Core -->
  <circle cx="24" cy="23" r="4.5" fill="url(#qsGradient)" filter="url(#qsGlow)" />
  <circle cx="24" cy="23" r="2" fill="#07111F" />

  <!-- Quantum Connection Vectors -->
  <line x1="24" y1="13" x2="24" y2="18.5" stroke="#00E5B0" stroke-width="1.5" />
  <line x1="24" y1="33" x2="24" y2="27.5" stroke="#00E5B0" stroke-width="1.5" />
  <line x1="16" y1="23" x2="19.5" y2="23" stroke="#00D9FF" stroke-width="1.5" />
  <line x1="32" y1="23" x2="28.5" y2="23" stroke="#00D9FF" stroke-width="1.5" />

  <!-- Subtle Vertex Nodes -->
  <circle cx="24" cy="13" r="1.5" fill="#00E5B0" />
  <circle cx="32" cy="18" r="1.5" fill="#00D9FF" />
  <circle cx="32" cy="28" r="1.5" fill="#00D9FF" />
  <circle cx="24" cy="33" r="1.5" fill="#00E5B0" />
  <circle cx="16" cy="28" r="1.5" fill="#00D9FF" />
  <circle cx="16" cy="18" r="1.5" fill="#00D9FF" />
</svg>
